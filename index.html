<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RentSmart AI · DeepSeek 驱动</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f7f6;--card:#fff;--green:#22A06B;--g2:#1B7D54;--text:#1A2E1F;--t2:#4A6358;--t3:#7A9489;--border:#e2ebe6;--red:#E35B5B;--orange:#F0A14A;--shadow:0 2px 12px rgba(0,0,0,.05)}
body{font-family:-apple-system,'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);max-width:430px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.head{position:sticky;top:0;z-index:10;padding:10px 16px;background:rgba(255,255,255,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.head .logo{font-weight:700;font-size:17px;color:var(--green);display:flex;align-items:center;gap:6px}
.head .status{font-size:9px;color:var(--t3);display:flex;align-items:center;gap:4px}
.head .status .live{width:6px;height:6px;border-radius:50%;background:var(--green);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}

.chat{flex:1;overflow-y:auto;padding:12px 14px;padding-bottom:80px}
.msg{display:flex;gap:8px;margin-bottom:16px;animation:in .35s ease}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.msg.user{flex-direction:row-reverse}
.msg .av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:15px}
.msg.assistant .av{background:#e3f5ed}
.msg.user .av{background:var(--green);color:#fff;font-size:14px}
.msg .bub{max-width:80%;padding:10px 14px;border-radius:16px;font-size:14px;line-height:1.7;white-space:pre-wrap;word-break:break-word}
.msg.assistant .bub{background:var(--card);border:1px solid var(--border);border-top-left-radius:4px}
.msg.user .bub{background:var(--green);color:#fff;border-top-right-radius:4px}
.msg .bub code{background:rgba(0,0,0,.06);padding:2px 6px;border-radius:4px;font-size:13px}
.msg .bub strong{color:var(--green)}
.msg.assistant .bub strong{color:var(--g2)}

.typing{display:flex;gap:6px;padding:8px 14px}
.typing span{width:8px;height:8px;border-radius:50%;background:var(--t3);animation:pulse 1.4s infinite}
.typing span:nth-child(2){animation-delay:.2s}.typing span:nth-child(3){animation-delay:.4s}

.foot{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;background:rgba(255,255,255,.95);backdrop-filter:blur(12px);border-top:1px solid var(--border);padding:8px 12px 18px;display:flex;gap:8px;z-index:20}
.foot input{flex:1;padding:11px 14px;border:1.5px solid var(--border);border-radius:22px;font-size:14px;outline:none;background:var(--bg);font-family:inherit;transition:border .2s}
.foot input:focus{border-color:var(--green)}
.foot button{padding:10px 18px;background:var(--green);color:#fff;border:none;border-radius:22px;font-size:14px;cursor:pointer;font-weight:600;white-space:nowrap;transition:background .2s}
.foot button:hover{background:var(--g2)}
.foot button:disabled{opacity:.5;cursor:default}

.suggest{display:flex;gap:6px;flex-wrap:wrap;padding:8px 14px}
.suggest-btn{padding:6px 14px;border:1px solid var(--border);border-radius:18px;font-size:12px;background:var(--card);cursor:pointer;white-space:nowrap;transition:all .15s;color:var(--t2)}
.suggest-btn:hover{border-color:var(--green);color:var(--green);background:#f0faf5}
</style>
</head>
<body>

<div class="head">
  <span class="logo">🏠 RentSmart AI</span>
  <span class="status"><span class="live"></span>DeepSeek 在线</span>
</div>

<div class="chat" id="chat"></div>

<div id="typingBox" class="typing" style="display:none"><span></span><span></span><span></span></div>

<div class="suggest" id="suggests">
  <button class="suggest-btn" onclick="quickAsk(this.textContent)">深圳南山3千以内整租推荐</button>
  <button class="suggest-btn" onclick="quickAsk(this.textContent)">租房合同要注意哪些坑</button>
  <button class="suggest-btn" onclick="quickAsk(this.textContent)">合租和整租怎么选</button>
  <button class="suggest-btn" onclick="quickAsk(this.textContent)">押金不退怎么办</button>
</div>

<div class="foot">
  <input id="inp" placeholder="描述你的租房需求..." onkeydown="if(event.key==='Enter')send()" autofocus>
  <button id="btn" onclick="send()">发送</button>
</div>

<script>
const API_KEY='sk-60e97f374ac847b49c082cef2c45b1cb';
const API_URL='https://api.deepseek.com/v1/chat/completions';

const chat=document.getElementById('chat'),inp=document.getElementById('inp'),
      btn=document.getElementById('btn'),typingBox=document.getElementById('typingBox'),
      suggests=document.getElementById('suggests');

let messages=[{role:'system',content:'你是 RentSmart AI 租房助手。你的用户正在找租房。你要像一个真正懂租房市场、懂合同法、懂避坑的朋友一样给出具体实用建议。用中文回答。可以适当使用emoji。每次回答控制在300字以内，但要信息量大。重点覆盖：房源推荐、价格分析、合同陷阱、法律常识。'}];

function addMsg(role,text){
  const d=document.createElement('div');
  d.className='msg '+role;
  d.innerHTML=`<div class="av">${role==='assistant'?'🤖':'👤'}</div><div class="bub">${text}</div>`;
  chat.appendChild(d);
  chat.scrollTop=chat.scrollHeight;
}

function showTyping(){
  typingBox.style.display='flex';
  chat.scrollTop=chat.scrollHeight;
}
function hideTyping(){typingBox.style.display='none'}

async function send(){
  const text=inp.value.trim();
  if(!text || btn.disabled) return;
  
  addMsg('user',text);
  messages.push({role:'user',content:text});
  inp.value='';
  btn.disabled=true;
  suggests.style.display='none';
  showTyping();
  
  try{
    const resp=await fetch(API_URL,{
      method:'POST',
      headers:{'Content-Type':'application/json','Authorization':'Bearer '+API_KEY},
      body:JSON.stringify({
        model:'deepseek-chat',
        messages:messages.slice(-12),
        temperature:0.7,
        max_tokens:500
      })
    });
    const data=await resp.json();
    hideTyping();
    
    if(data.choices && data.choices[0]){
      const reply=data.choices[0].message.content;
      addMsg('assistant',reply);
      messages.push({role:'assistant',content:reply});
    } else {
      addMsg('assistant','抱歉，AI 服务暂时不可用：'+JSON.stringify(data).slice(0,100));
    }
  }catch(e){
    hideTyping();
    addMsg('assistant','⚠️ 网络错误，请检查后重试。'+e.message.slice(0,80));
  }
  btn.disabled=false;
  inp.focus();
}

function quickAsk(text){
  inp.value=text;
  send();
}

// Welcome
addMsg('assistant','你好！我是 **RentSmart AI** 🏠\n\n由 DeepSeek 驱动，真实AI对话。试试问我：\n\n🔍 "深圳南山3千以内整租推荐"\n💡 "租房合同要注意什么"\n⚖️ "押金不退怎么办"\n💰 "合租和整租怎么选"\n\n不如直接告诉我你的情况，我来帮你分析！');
</script>
</body>
</html>
