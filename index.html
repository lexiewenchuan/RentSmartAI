<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>RentSmart AI - 智能租房助手</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--bg:#f5f7f6;--card:#fff;--accent:#22A06B;--a2:#1B7D54;--text:#1A2E1F;--t2:#4A6358;--t3:#7A9489;--border:#e2ebe6;--red:#E35B5B;--orange:#F0A14A;--shadow:0 2px 12px rgba(0,0,0,.06);--nav-h:54px}
body{font-family:-apple-system,'Noto Sans SC',sans-serif;background:var(--bg);color:var(--text);max-width:420px;margin:0 auto;min-height:100vh;padding-bottom:calc(var(--nav-h) + 10px)}
.header{position:sticky;top:0;z-index:30;padding:12px 16px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px}
.header .logo{font-weight:700;font-size:17px;color:var(--accent)}
.header .tag{font-size:10px;color:var(--t3);margin-left:auto}
.bottom-nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:420px;background:var(--card);border-top:1px solid var(--border);display:flex;overflow-x:auto;z-index:30;height:var(--nav-h);-webkit-overflow-scrolling:touch;scrollbar-width:none}
.bottom-nav::-webkit-scrollbar{display:none}
.bottom-nav .tab{flex-shrink:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px 10px;cursor:pointer;border:none;background:none;font-size:10px;color:var(--t3);transition:color .2s;min-width:48px}
.bottom-nav .tab.active{color:var(--accent);font-weight:600}
.bottom-nav .tab .icon{font-size:16px}
.page{display:none;min-height:calc(100vh - 56px - var(--nav-h))}
.page.active{display:block}
.card{background:var(--card);border-radius:14px;padding:14px;margin:10px 14px;box-shadow:var(--shadow);border:1px solid var(--border)}
.card .tag-row{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.card .tag-row .t{font-size:11px;padding:3px 8px;border-radius:10px;background:var(--bg);color:var(--t2)}
/* Images */
.prop-img{width:100%;height:180px;object-fit:cover;border-radius:10px;background:#e8edea}
.prop-img-sm{width:100%;height:130px;object-fit:cover;border-radius:10px 10px 0 0;background:#e8edea}
.prop-img-hero{width:100%;height:220px;object-fit:cover;border-radius:14px;background:#e8edea}
.prop-img-placeholder{display:flex;align-items:center;justify-content:center;color:var(--t3);font-size:40px;background:linear-gradient(135deg,#e8edea,#d5e0da)}
/* Chat */
.chat-area{padding:10px 14px;min-height:60vh;max-height:calc(100vh - 180px);overflow-y:auto}
.chat-msg{display:flex;gap:8px;margin-bottom:14px;animation:up .3s}
@keyframes up{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.chat-msg.user{flex-direction:row-reverse}
.chat-msg .av{width:32px;height:32px;border-radius:50%;flex-shrink:0;display:flex;align-items:center;justify-content:center;font-size:16px}
.chat-msg.assistant .av{background:#e3f5ed}
.chat-msg.user .av{background:var(--accent);color:#fff}
.chat-msg .bubble{max-width:82%;padding:10px 14px;border-radius:14px;font-size:14px;line-height:1.7;word-break:break-word}
.chat-msg.assistant .bubble{background:var(--card);border:1px solid var(--border)}
.chat-msg.user .bubble{background:var(--accent);color:#fff}
.chat-bar{display:flex;gap:8px;padding:8px 12px 16px;background:var(--card);border-top:1px solid var(--border)}
.chat-bar input{flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:20px;font-size:14px;outline:none;background:var(--bg);font-family:inherit}
.chat-bar input:focus{border-color:var(--accent)}
.chat-bar button{padding:10px 16px;background:var(--accent);color:#fff;border:none;border-radius:20px;font-size:14px;cursor:pointer;font-weight:600;white-space:nowrap}
.chat-bar button:disabled{opacity:.5}
.loading{display:flex;gap:4px;padding:10px 14px}
.loading span{width:8px;height:8px;border-radius:50%;background:var(--t3);animation:pulse 1.4s infinite}
.loading span:nth-child(2){animation-delay:.2s}.loading span:nth-child(3){animation-delay:.4s}
@keyframes pulse{0%,80%,100%{opacity:.3}40%{opacity:1}}
.announce{text-align:center;padding:10px;font-size:12px;color:var(--t3)}
.announce .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin-right:4px;animation:pulse 2s infinite}
.prop-link{color:var(--accent);text-decoration:underline;cursor:pointer;font-weight:600}
/* Home */
.hero{background:linear-gradient(135deg,#0D5C3A,#1B7D54,#22A06B,#2BBD7E);color:#fff;padding:28px 20px;margin:12px 14px;border-radius:18px;box-shadow:0 8px 32px rgba(13,92,58,.3);position:relative;overflow:hidden}
.hero::before{content:'';position:absolute;top:-30px;right:-20px;width:120px;height:120px;background:rgba(255,255,255,.08);border-radius:50%}
.hero::after{content:'';position:absolute;bottom:-20px;left:-10px;width:80px;height:80px;background:rgba(255,255,255,.05);border-radius:50%}
.hero h2{font-size:22px;margin-bottom:6px;position:relative;z-index:1}
.hero p{font-size:13px;opacity:.9;line-height:1.6;position:relative;z-index:1}
.hero .stats{display:flex;gap:20px;margin-top:16px;position:relative;z-index:1}
.hero .stats .st{text-align:center;flex:1}
.hero .stats .st .num{font-size:26px;font-weight:800}
.hero .stats .st .lbl{font-size:10px;opacity:.8;margin-top:2px}
.quick-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 14px}
.quick-actions .qa{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:14px;text-align:center;cursor:pointer;transition:all .15s;font-size:13px;font-weight:600;color:var(--text);box-shadow:var(--shadow)}
.quick-actions .qa:active{transform:scale(.96);background:var(--bg)}
.quick-actions .qa .qa-icon{font-size:24px;display:block;margin-bottom:4px}
/* City grid */
.city-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 14px}
.city-chip{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 6px;text-align:center;cursor:pointer;transition:all .2s;box-shadow:var(--shadow);font-size:12px;font-weight:600}
.city-chip:active{transform:scale(.94);background:#e3f5ed;border-color:var(--accent)}
.city-chip .cc-em{font-size:20px;display:block}
.city-chip .cc-n{font-size:10px;color:var(--t3);margin-top:2px}
/* Home search */
.home-search{display:flex;gap:8px;margin:12px 14px}
.home-search input{flex:1;padding:12px 16px;border:2px solid var(--border);border-radius:24px;font-size:14px;outline:none;background:var(--card);font-family:inherit;box-shadow:var(--shadow);transition:border .2s}
.home-search input:focus{border-color:var(--accent)}
.home-search button{padding:12px 20px;background:var(--accent);color:#fff;border:none;border-radius:24px;font-size:14px;cursor:pointer;font-weight:600;box-shadow:0 4px 12px rgba(34,160,107,.3)}
/* Featured grid */
.featured-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:0 14px 10px}
.featured-card{padding:0;overflow:hidden;border-radius:14px;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:var(--shadow)}
.featured-card:hover{transform:translateY(-2px);box-shadow:0 6px 20px rgba(0,0,0,.1)}
.featured-card:active{transform:scale(.97)}
.featured-card .fc-img{width:100%;height:100px;object-fit:cover;background:#e8edea}
.featured-card .fc-body{padding:10px 12px 12px}
.featured-card .fc-price{font-size:17px;font-weight:700;color:var(--accent)}
.featured-card .fc-price span{font-size:11px;font-weight:400;color:var(--t3)}
.featured-card .fc-name{font-size:13px;font-weight:600;margin:2px 0 4px;line-height:1.3;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.featured-card .fc-meta{font-size:11px;color:var(--t2);display:flex;gap:8px}
.section-title{font-size:15px;font-weight:700;padding:6px 14px 0;display:flex;align-items:center;gap:6px}
.section-title .more{font-size:12px;color:var(--accent);margin-left:auto;cursor:pointer;font-weight:400}
/* Detail */
.back-btn{padding:8px 14px;background:none;border:none;color:var(--accent);font-size:14px;cursor:pointer;font-weight:600;display:flex;align-items:center;gap:4px}
.detail-header{position:relative}
.detail-header .price-big{font-size:28px;font-weight:700;color:var(--accent)}
.detail-header .price-big span{font-size:14px;color:var(--t3);font-weight:400}
.detail-meta{display:flex;gap:16px;margin:10px 0;font-size:13px;color:var(--t2)}
.detail-section{margin-top:12px}
.detail-section h4{font-size:13px;color:var(--t3);margin-bottom:6px;text-transform:uppercase;letter-spacing:1px}
.detail-actions{display:flex;gap:8px;margin-top:12px}
.detail-actions button{flex:1;padding:10px;border-radius:10px;border:none;font-size:13px;cursor:pointer;font-weight:600}
.btn-primary{background:var(--accent);color:#fff}
.btn-outline{background:var(--card);color:var(--accent);border:1px solid var(--accent)}
/* Search */
.filter-bar{display:flex;gap:6px;padding:10px 14px;flex-wrap:wrap}
.filter-bar select,.filter-bar input{padding:8px 10px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);outline:none;font-family:inherit}
.filter-bar select:focus,.filter-bar input:focus{border-color:var(--accent)}
.filter-bar input{flex:1;min-width:80px}
.filter-bar button{padding:8px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.listing{cursor:pointer;transition:transform .15s;overflow:hidden;padding:0}
.listing:active{transform:scale(.98)}
.listing .lc-body{padding:14px}
.listing .price{font-size:20px;font-weight:700;color:var(--accent)}
.listing .price span{font-size:12px;font-weight:400;color:var(--t3)}
.listing .meta{display:flex;gap:12px;margin-top:4px;font-size:12px;color:var(--t2)}
.listing .view-hint{margin-top:6px;font-size:12px;color:var(--accent);font-weight:600}
.ai-tip{background:#e3f5ed;padding:8px 12px;border-radius:8px;font-size:12px;color:var(--a2);margin-top:8px;line-height:1.6}
/* Compare */
.compare-select{display:flex;gap:6px;padding:10px 14px;align-items:center;flex-wrap:wrap}
.compare-select select{flex:1;min-width:80px;padding:8px;border:1px solid var(--border);border-radius:8px;font-size:13px;background:var(--card);outline:none;font-family:inherit}
.compare-select span{color:var(--t3);font-weight:600;font-size:13px}
.compare-select button{padding:8px 14px;background:var(--accent);color:#fff;border:none;border-radius:8px;cursor:pointer;font-weight:600}
.compare-table{width:100%;border-collapse:collapse;font-size:13px}
.compare-table th,.compare-table td{padding:10px 12px;text-align:center;border-bottom:1px solid var(--border)}
.compare-table th:first-child,.compare-table td:first-child{text-align:left;font-weight:600;color:var(--t2);width:30%}
.compare-table th{color:var(--t3);font-size:11px;font-weight:500;background:var(--bg)}
.highlight{background:#e3f5ed}
/* Risk */
.risk-item{display:flex;align-items:center;gap:10px;padding:12px;border-bottom:1px solid var(--border);cursor:pointer}
.risk-item:last-child{border-bottom:none}
.risk-item .check{width:22px;height:22px;border:2px solid var(--border);border-radius:6px;flex-shrink:0;display:flex;align-items:center;justify-content:center;transition:.2s}
.risk-item .check.checked{background:var(--accent);border-color:var(--accent)}
.risk-item .check.checked::after{content:'✓';color:#fff;font-size:14px}
.risk-item .label{flex:1;font-size:14px}
.risk-lvl{padding:3px 8px;border-radius:10px;font-size:11px;font-weight:600}
.risk-lvl.high{background:#fde8e8;color:var(--red)}.risk-lvl.med{background:#fef3e2;color:var(--orange)}.risk-lvl.low{background:#e3f5ed;color:var(--accent)}
.risk-result{background:#e3f5ed;padding:12px;border-radius:8px;font-size:14px;line-height:1.7;margin-top:10px}
/* Legal */
.qa-list .qa-item{padding:12px 0;border-bottom:1px solid var(--border);cursor:pointer}
.qa-list .qa-item:last-child{border-bottom:none}
.qa-list .q{font-size:14px;font-weight:600;margin-bottom:4px}
.qa-list .a{font-size:12px;color:var(--t2);display:none;line-height:1.7}
.qa-list .qa-item.open .a{display:block}
</style>
</head>
<body>

<div class="header"><span class="logo">🏠 RentSmart AI</span><span class="tag">DeepSeek 驱动</span></div>

<!-- HOME -->
<div class="page active" id="page-home">
  <div class="hero">
    <h2>🏡 智能找房，从这里开始</h2>
    <p>DeepSeek AI 驱动 · 真实房源数据 · 智能分析推荐</p>
    <div class="stats">
      <div class="st"><div class="num">300</div><div class="lbl">精选房源</div></div>
      <div class="st"><div class="num">12</div><div class="lbl">覆盖城市</div></div>
      <div class="st"><div class="num">AI</div><div class="lbl">实时分析</div></div>
    </div>
  </div>
  <div class="home-search">
    <input id="homeSearchInp" placeholder="🔍 输入城市、区域或关键词搜房源..." onkeydown="if(event.key==='Enter')homeSearch()">
    <button onclick="homeSearch()">搜索</button>
  </div>
  <div class="city-grid" id="cityGrid"></div>
  <div class="quick-actions">
    <div class="qa" onclick="switchTab('search')"><span class="qa-icon">🔍</span>全部房源</div>
    <div class="qa" onclick="switchTab('chat')"><span class="qa-icon">💬</span>AI对话</div>
    <div class="qa" onclick="switchTab('compare')"><span class="qa-icon">⚖️</span>房源对比</div>
    <div class="qa" onclick="switchTab('risk')"><span class="qa-icon">🛡️</span>风险筛查</div>
  </div>
  <div class="section-title">🔥 精选推荐 <span class="more" onclick="switchTab('search')">查看全部 300 套 →</span></div>
  <div class="featured-grid" id="featuredList"></div>
</div>

<!-- CHAT -->
<div class="page" id="page-chat">
  <div class="announce"><span class="dot"></span>真实AI对话 · 点击蓝色房源名查看详情</div>
  <div class="chat-area" id="chat"></div>
  <div id="chatLoading" class="loading" style="display:none"><span></span><span></span><span></span></div>
  <div class="chat-bar">
    <input id="chatInp" placeholder="说说你的租房需求..." onkeydown="if(event.key==='Enter')chatSend()">
    <button id="chatBtn" onclick="chatSend()">发送</button>
  </div>
</div>

<!-- SEARCH -->
<div class="page" id="page-search">
  <div class="filter-bar">
    <select id="city"><option value="">全部城市</option></select>
    <select id="district"><option value="">全部区域</option></select>
    <input id="budget" placeholder="预算上限(元)" type="number">
    <button onclick="searchProps()">搜索</button>
  </div>
  <div id="searchLoading" class="loading" style="display:none;margin:0 14px"><span></span><span></span><span></span></div>
  <div id="searchResults"></div>
</div>

<!-- DETAIL -->
<div class="page" id="page-detail">
  <button class="back-btn" onclick="switchTab('search')">← 返回列表</button>
  <div id="detailContent"></div>
</div>

<!-- COMPARE -->
<div class="page" id="page-compare">
  <div class="card" style="text-align:center;color:var(--t3);font-size:13px;margin-bottom:6px">选择两个房源，AI帮你全方位对比</div>
  <div class="compare-select">
    <select id="compA"><option value="">-- 房源A --</option></select>
    <span>VS</span>
    <select id="compB"><option value="">-- 房源B --</option></select>
    <button onclick="compareProps()">对比</button>
  </div>
  <div id="compLoading" class="loading" style="display:none;margin:0 14px"><span></span><span></span><span></span></div>
  <div id="compResult"></div>
</div>

<!-- LEGAL -->
<div class="page" id="page-legal">
  <div class="card" style="text-align:center;color:var(--t3);font-size:13px">租房法律问题，点下面或自己提问</div>
  <div id="legalQAList" class="card qa-list"></div>
  <div class="chat-bar" style="position:static;max-width:none;margin:0 14px">
    <input id="legalInp" placeholder="输入你的法律问题..." onkeydown="if(event.key==='Enter')legalAsk()">
    <button id="legalBtn" onclick="legalAsk()">提问</button>
  </div>
  <div id="legalLoading" class="loading" style="display:none;margin:0 14px"><span></span><span></span><span></span></div>
  <div id="legalAnswer" style="margin:0 14px"></div>
</div>

<!-- RISK -->
<div class="page" id="page-risk">
  <div class="card" style="text-align:center;color:var(--t3);font-size:13px">勾选你遇到的情况，AI评估风险</div>
  <div class="card" id="riskChecks"></div>
  <div style="padding:0 14px">
    <button onclick="riskAnalyze()" style="width:100%;padding:12px;background:var(--accent);color:#fff;border:none;border-radius:10px;font-size:15px;cursor:pointer;font-weight:600">🔍 AI分析风险</button>
  </div>
  <div id="riskLoading" class="loading" style="display:none;margin:10px 14px"><span></span><span></span><span></span></div>
  <div id="riskResult" style="margin:10px 14px"></div>
</div>

<!-- Bottom Nav -->
<div class="bottom-nav">
  <button class="tab active" onclick="switchTab('home')"><span class="icon">🏠</span>首页</button>
  <button class="tab" onclick="switchTab('chat')"><span class="icon">💬</span>AI对话</button>
  <button class="tab" onclick="switchTab('search')"><span class="icon">🔍</span>找房</button>
  <button class="tab" onclick="switchTab('detail')"><span class="icon">📋</span>详情</button>
  <button class="tab" onclick="switchTab('compare')"><span class="icon">⚖️</span>对比</button>
  <button class="tab" onclick="switchTab('legal')"><span class="icon">📜</span>法律</button>
  <button class="tab" onclick="switchTab('risk')"><span class="icon">🛡️</span>风险</button>
</div>

<script>
// ===== DeepSeek API =====
const DK='sk-60e97f374ac847b49c082cef2c45b1cb';
const DU='https://api.deepseek.com/v1/chat/completions';
async function ai(messages,opts={}){
  const r=await fetch(DU,{method:'POST',
    headers:{'Authorization':'Bearer '+DK,'Content-Type':'application/json'},
    body:JSON.stringify({model:'deepseek-chat',messages,temperature:opts.temp||0.7,max_tokens:opts.tokens||600})
  });
  const d=await r.json();
  if(d.error)return '[API错误: '+d.error.message+']';
  return d.choices[0].message.content;
}

// ===== Tab switching =====
const tabMap={home:'首页',chat:'AI对话',search:'找房',detail:'详情',compare:'对比',legal:'法律',risk:'风险'};
function switchTab(tab){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  const pg=document.getElementById('page-'+tab);
  if(pg)pg.classList.add('active');
  document.querySelectorAll('.tab').forEach(t=>{if(t.textContent.includes(tabMap[tab]))t.classList.add('active')});
  const activeTab=document.querySelector('.tab.active');
  if(activeTab)activeTab.scrollIntoView({behavior:'smooth',block:'nearest',inline:'center'});
  if(tab==='chat')document.getElementById('chatInp').focus();
  if(tab==='home')renderHomeFeatured();
}
function show(id){document.getElementById(id).style.display='flex';}
function hide(id){document.getElementById(id).style.display='none';}
function imgUrl(seed,w,h){return 'https://picsum.photos/seed/'+seed+'/'+w+'/'+h;}

// ===== PROPERTY DATA - 12 listings across 6 cities =====
const propData=[

  const citySel=document.getElementById('city');
  const districtSel=document.getElementById('district');
  const cities=[...new Set(propData.map(p=>p.city))];
  citySel.innerHTML='<option value="">全部城市</option>'+cities.map(c=>'<option value="'+c+'">'+c+'</option>').join('');
  citySel.onchange=function(){
    const city=this.value;
    const districts=[...new Set(propData.filter(p=>!city||p.city===city).map(p=>p.district))];
    districtSel.innerHTML='<option value="">全部区域</option>'+districts.map(d=>'<option value="'+d+'">'+d+'</option>').join('');
  };
  citySel.onchange();
}

// ===== HOME =====
function renderCityGrid(){
  const grid=document.getElementById('cityGrid');
  const cities=[...new Set(propData.map(p=>p.city))];
  const emojis={深圳:'🏙️',北京:'🏯',上海:'🌃',广州:'🌺',杭州:'🍵',成都:'🐼',武汉:'🏗️',南京:'🏛️',苏州:'🏞️',西安:'🏰',重庆:'🌉',长沙:'🎆'};
  grid.innerHTML=cities.map(c=>{
    const cnt=propData.filter(p=>p.city===c).length;
    return '<div class="city-chip" onclick="pickCity(\''+c+'\')"><span class="cc-em">'+(emojis[c]||'🏘️')+'</span>'+c+'<div class="cc-n">'+cnt+'套</div></div>';
  }).join('');
  // Shuffle featured
  const shuffled=[...propData].sort(()=>Math.random()-.5);
  renderFeatured(shuffled.slice(0,6));
}
function pickCity(city){
  document.getElementById('city').value=city;
  document.getElementById('city').onchange();
  searchProps();
  switchTab('search');
}
function homeSearch(){
  const q=document.getElementById('homeSearchInp').value.trim();
  if(!q)return;
  // Try matching city
  for(const c of [...new Set(propData.map(p=>p.city))]){
    if(c.includes(q)||q.includes(c)){pickCity(c);return;}
  }
  // Fallback: search all text fields
  switchTab('search');
  document.getElementById('budget').value='';
  document.getElementById('city').value='';
  document.getElementById('district').value='';
  const results=propData.filter(p=>
    p.name.includes(q)||p.district.includes(q)||p.city.includes(q)||
    p.desc.includes(q)||p.tags.some(t=>t.includes(q))||
    p.metro.includes(q)
  );
  const res=document.getElementById('searchResults');
  if(results.length===0){
    res.innerHTML='<div class="card" style="text-align:center;color:var(--t3);padding:30px">未找到匹配「'+q+'」的房源<br><span style="font-size:12px">试试其他关键词</span></div>';
  }else{
    renderPropCards(results.slice(0,50));
  }
}
function renderFeatured(props){
  const list=document.getElementById('featuredList');
  list.innerHTML=props.map(p=>
    '<div class="featured-card" onclick="showDetail(\''+p.id+'\')">'+
    '<img class="fc-img" src="'+imgUrl(p.imgSeed,300,150)+'" alt="'+p.name+'" loading="lazy" onerror="this.style.display=\'none\'">'+
    '<div class="fc-body"><div class="fc-price">¥'+p.price+'<span>/月</span></div>'+
    '<div class="fc-name">'+p.name+'</div>'+
    '<div class="fc-meta"><span>'+p.city+p.district+'</span><span>'+p.size+'㎡</span></div></div></div>'
  ).join('');
}
function renderHomeFeatured(){renderCityGrid();}

function addToCompare(propId){document.getElementById('compA').value=propId;switchTab('compare');}

// ===== CHAT =====
let chatMsgs=[{role:'system',content:'你是 RentSmart AI 智能租房助手。推荐房源时请用「房源名」格式提到具体房源名称。帮助用户找房、分析房源、识别租房风险、提供法律建议。回答要具体实用，控制在200字以内。'}];

function linkifyProps(text){
  let out=text;
  propData.forEach(p=>{const regex=new RegExp(p.name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'g');out=out.replace(regex,'<span class="prop-link" onclick="showDetail(\''+p.id+'\')">'+p.name+'</span>');});
  return out;
}

function addMsg(role,text){
  const div=document.createElement('div');
  div.className='chat-msg '+role;
  div.innerHTML='<div class="av">'+(role==='assistant'?'🤖':'👤')+'</div><div class="bubble">'+(role==='assistant'?linkifyProps(text):text)+'</div>';
  document.getElementById('chat').appendChild(div);
  document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight;
}

async function chatSend(){
  const inp=document.getElementById('chatInp'),text=inp.value.trim();
  if(!text)return;
  addMsg('user',text);chatMsgs.push({role:'user',content:text});
  inp.value='';document.getElementById('chatBtn').disabled=true;show('chatLoading');
  try{
    const ctx=[chatMsgs[0],{role:'system',content:'当前可推荐房源（12套）：\n'+propData.map(p=>'「'+p.name+'」¥'+p.price+'/月 '+p.size+'㎡ '+p.city+p.district+' 标签：'+p.tags.join('、')).join('\n')},...chatMsgs.slice(-8)];
    const reply=await ai(ctx);
    hide('chatLoading');addMsg('assistant',reply);chatMsgs.push({role:'assistant',content:reply});
  }catch(e){hide('chatLoading');addMsg('assistant','网络错误，请重试。');}
  document.getElementById('chatBtn').disabled=false;inp.focus();
}
addMsg('assistant','你好！我是 RentSmart AI 🤖\n\n由 DeepSeek 驱动，拥有300套精选房源：\n🏙️ 深圳·北京·上海·广州·杭州·成都\n🏙️ 武汉·南京·苏州·西安·重庆·长沙\n\n💬 问我"南山3000以内"推荐\n🔍 去首页搜城市或关键词\n⚖️ 用"对比"PK两套房');

// ===== SEARCH =====
function renderPropCards(props,containerId){
  const res=document.getElementById(containerId||'searchResults');
  res.innerHTML='<div style="font-size:12px;color:var(--t3);padding:4px 14px">找到 '+props.length+' 套房源</div>';
  res.innerHTML+=props.map(p=>
    '<div class="card listing" onclick="showDetail(\''+p.id+'\')">'+
    '<img class="prop-img" src="'+imgUrl(p.imgSeed,400,250)+'" alt="'+p.name+'" loading="lazy" onerror="this.style.display=\'none\'">
    '<div class="lc-body"><div class="price">¥'+p.price+'<span>/月</span></div>'+
    '<div style="font-weight:600;margin-bottom:4px">'+p.name+'</div>'+
    '<div class="meta"><span>📍 '+p.city+p.district+'</span><span>'+p.type+'</span><span>'+p.size+'㎡</span></div>'+
    '<div class="meta"><span>🚇 '+p.metro+'</span><span>🏗️ '+p.buildYear+'年</span></div>'+
    '<div class="tag-row">'+p.tags.map(t=>'<span class="t">'+t+'</span>').join('')+'</div>'+
    '<div class="view-hint">点击查看详情 →</div></div></div>'
  ).join('');
}
function searchProps(){
  const city=document.getElementById('city').value;
  const district=document.getElementById('district').value;
  const budget=parseInt(document.getElementById('budget').value)||999999;
  let filtered=propData.filter(p=>(!city||p.city===city)&&(!district||p.district===district)&&p.price<=budget);
  const res=document.getElementById('searchResults');
  if(!filtered.length){res.innerHTML='<div class="card" style="text-align:center;color:var(--t3);padding:30px">暂无匹配房源<br><span style="font-size:12px">试试扩大搜索范围</span></div>';return;}
  renderPropCards(filtered);
}

async function aiAnalyzeProp(p,containerId){
  const res=document.getElementById(containerId);
  const tip=document.createElement('div');
  tip.className='ai-tip';
  tip.innerHTML='<div class="loading" style="padding:0"><span></span><span></span><span></span></div> AI分析中…';
  res.prepend(tip);
  try{
    const reply=await ai([
      {role:'system',content:'你是租房专家。根据房源信息给出分析：优点、缺点、适合人群、议价建议。控制在150字以内。'},
      {role:'user',content:'分析：'+p.name+'，'+p.city+p.district+'，¥'+p.price+'/月，'+p.size+'㎡，'+p.type+'，'+p.metro+'，'+p.buildYear+'年建\n特点：'+p.tags.join('、')+'\n描述：'+p.desc}
    ]);
    tip.innerHTML='🤖 <b>AI分析：</b>'+linkifyProps(reply);
  }catch(e){tip.innerHTML='⚠️ AI请求失败，请重试';}
}

// ===== COMPARE =====
function initCompare(){
  const a=document.getElementById('compA'),b=document.getElementById('compB');
  a.innerHTML='<option value="">-- 房源A --</option>';b.innerHTML='<option value="">-- 房源B --</option>';
  propData.forEach(p=>{const o=document.createElement('option');o.value=p.id;o.textContent='['+p.city+'] '+p.name+' ¥'+p.price;a.appendChild(o.cloneNode(true));b.appendChild(o);});
}
async function compareProps(){
  const aid=document.getElementById('compA').value,bid=document.getElementById('compB').value;
  if(!aid||!bid)return alert('请选择两个房源');
  if(aid===bid)return alert('请选择不同房源');
  const pa=propData.find(p=>p.id===aid),pb=propData.find(p=>p.id===bid);
  show('compLoading');
  const res=document.getElementById('compResult');
  res.innerHTML='<div class="card"><table class="compare-table"><tr><th>对比项</th><th><span class="prop-link" onclick="showDetail(\''+pa.id+'\')">'+pa.name+'</span></th><th><span class="prop-link" onclick="showDetail(\''+pb.id+'\')">'+pb.name+'</span></th></tr>'+
    [{k:'价格',va:'¥'+pa.price+'/月',vb:'¥'+pb.price+'/月',hl:pa.price<pb.price},
     {k:'面积',va:pa.size+'㎡',vb:pb.size+'㎡',hl:pa.size>pb.size},{k:'城市区域',va:pa.city+pa.district,vb:pb.city+pb.district,hl:false},
     {k:'类型',va:pa.type,vb:pb.type,hl:false},{k:'楼层',va:pa.floor,vb:pb.floor,hl:false},
     {k:'地铁',va:pa.metro,vb:pb.metro,hl:false},{k:'建成年份',va:pa.buildYear+'年',vb:pb.buildYear+'年',hl:pa.buildYear>pb.buildYear}]
    .map(r=>'<tr'+(r.hl?' class="highlight"':'')+'><td>'+r.k+'</td><td>'+r.va+'</td><td>'+r.vb+'</td></tr>').join('')+'</table></div>';
  try{
    const analysis=await ai([
      {role:'system',content:'你是租房对比专家。对比两个房源给出推荐及理由，控制在120字，用数据说话。'},
      {role:'user',content:'A：「'+pa.name+'」¥'+pa.price+' '+pa.size+'㎡ '+pa.city+pa.district+' '+pa.metro+'\nB：「'+pb.name+'」¥'+pb.price+' '+pb.size+'㎡ '+pb.city+pb.district+' '+pb.metro}
    ]);
    hide('compLoading');
    res.innerHTML+='<div class="card" style="background:#e3f5ed;margin-top:0;border-radius:0 0 14px 14px"><b>🤖 AI分析：</b>'+linkifyProps(analysis)+'</div>';
  }catch(e){hide('compLoading');res.innerHTML+='<div class="card" style="color:var(--red)">⚠️ AI请求失败</div>';}
}

// ===== LEGAL =====
const legalQAs=[{q:'押金不退怎么办？',a:null},{q:'房东可以随便涨房租吗？',a:null},{q:'提前退租违约金怎么算？',a:null},{q:'二房东转租合法吗？',a:null},{q:'租房合同需要备案吗？',a:null}];
function initLegal(){
  const list=document.getElementById('legalQAList');
  legalQAs.forEach(qa=>{
    const div=document.createElement('div');div.className='qa-item';
    div.innerHTML='<div class="q">📌 '+qa.q+'</div><div class="a"></div>';
    div.onclick=async function(){
      if(this.classList.contains('open')){this.classList.remove('open');return;}
      if(qa.a){this.querySelector('.a').textContent=qa.a;this.classList.add('open');return;}
      this.querySelector('.a').textContent='⏳ AI解答中…';this.classList.add('open');
      try{const r=await ai([{role:'system',content:'你是中国租房法律专家，熟悉《民法典》租赁合同章节。回答：引用法条+实操建议，200字以内。'},{role:'user',content:qa.q}]);qa.a=r;this.querySelector('.a').textContent=r;}
      catch(e){this.querySelector('.a').textContent='⚠️ 请求失败';}
    };list.appendChild(div);
  });
}
async function legalAsk(){
  const inp=document.getElementById('legalInp'),q=inp.value.trim();if(!q)return;
  show('legalLoading');inp.value='';document.getElementById('legalBtn').disabled=true;
  try{const r=await ai([{role:'system',content:'你是中国租房法律专家。引用法条+实操建议，200字以内。'},{role:'user',content:q}]);hide('legalLoading');document.getElementById('legalBtn').disabled=false;document.getElementById('legalAnswer').innerHTML='<div class="card" style="background:#e3f5ed"><b>🤖 问题：</b>'+q+'<br><br><b>💡 建议：</b>'+r+'</div>';}
  catch(e){hide('legalLoading');document.getElementById('legalBtn').disabled=false;}
}

// ===== RISK =====
const riskChecks=[{id:'r1',label:'房东未出示房产证/身份证',level:'high'},{id:'r2',label:'要求现金支付或私下转账',level:'high'},{id:'r3',label:'合同条款模糊/有空白处',level:'high'},{id:'r4',label:'押金超过两个月租金',level:'med'},{id:'r5',label:'房东拒绝提供发票/收据',level:'med'},{id:'r6',label:'看房时发现房屋有明显损坏',level:'med'},{id:'r7',label:'要求签合同前先交定金',level:'med'},{id:'r8',label:'小区/楼栋治安环境较差',level:'low'},{id:'r9',label:'水电费单价不明确',level:'low'},{id:'r10',label:'合租室友信息不透明',level:'low'}];
function initRisk(){
  const container=document.getElementById('riskChecks');
  riskChecks.forEach(r=>{const div=document.createElement('div');div.className='risk-item';div.innerHTML='<div class="check" id="check_'+r.id+'"></div><span class="label">'+r.label+'</span><span class="risk-lvl '+r.level+'">'+({high:'高危',med:'注意',low:'提醒'})[r.level]+'</span>';div.onclick=()=>document.getElementById('check_'+r.id).classList.toggle('checked');container.appendChild(div);});
}
async function riskAnalyze(){
  const checked=riskChecks.filter(r=>document.getElementById('check_'+r.id).classList.contains('checked'));
  if(!checked.length)return alert('请至少勾选一项风险');
  show('riskLoading');const hc=checked.filter(r=>r.level==='high').length,s='勾选'+checked.length+'项（高危'+hc+'项）';
  try{const r=await ai([{role:'system',content:'你是租房风险分析师。评估风险等级（安全/注意/危险），给应对建议。200字。'},{role:'user',content:s+'\n'+checked.map(r=>r.label).join('；')}]);hide('riskLoading');document.getElementById('riskResult').innerHTML='<div class="card risk-result"><b>📊 '+s+'</b><br><br><b>🤖 AI评估：</b>'+r+'</div>';}
  catch(e){hide('riskLoading');}
}

initFilters();initCompare();initLegal();initRisk();searchProps();renderHomeFeatured();
